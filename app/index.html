<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Calculadora de daño, equipos, catálogo de armas y consejero para Genshin Impact.">
  <title>Crónica de Teyvat</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e7bd"/><stop offset="1" stop-color="#b9955a"/></linearGradient></defs>
      <circle cx="20" cy="20" r="18" fill="none" stroke="url(#eg)" stroke-width="1.4" opacity=".7"/>
      <path d="M20 3 L23.2 16.8 L37 20 L23.2 23.2 L20 37 L16.8 23.2 L3 20 L16.8 16.8 Z" fill="url(#eg)"/>
      <path d="M20 11 L21.6 18.4 L29 20 L21.6 21.6 L20 29 L18.4 21.6 L11 20 L18.4 18.4 Z" fill="#2a2f40"/>
    </svg>
    <div class="titles">
      <span class="app-name">Crónica de Teyvat</span>
      <span class="section" id="section-name">Personajes</span>
    </div>
    <div class="spacer"></div>
    <button class="info-btn" id="about-btn" aria-label="Acerca de">?</button>
  </header>

  <main id="view"></main>

  <nav class="navbar" id="navbar">
    <button data-tab="personajes" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Personajes
    </button>
    <button data-tab="calculadora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20 L14 10"/><path d="M14 10 L19 3 L21 5 L14 10Z"/><path d="M6 14 L10 18"/><path d="M20 20 L10 10"/><path d="M10 10 L5 3 L3 5 L10 10Z"/><path d="M18 14 L14 18"/></svg>
      Calcular
    </button>
    <button data-tab="equipos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 19c1-3 3.5-5 6-5s5 2 6 5"/><path d="M14 14.5c.6-.3 1.3-.5 2-.5 2.5 0 5 2 6 5"/></svg>
      Equipos
    </button>
    <button data-tab="armas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 L14 9 L12 22 L10 9 Z"/><path d="M7 9h10"/></svg>
      Armas
    </button>
    <button data-tab="consejero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 L13.8 9.2 L21 11 L13.8 12.8 L12 20 L10.2 12.8 L3 11 L10.2 9.2 Z"/><path d="M19 17l.7 2.3L22 20l-2.3.7L19 23l-.7-2.3L16 20l2.3-.7z"/></svg>
      Consejero
    </button>
  </nav>

  <script src="data/gamedata.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/model.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
